<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <title>ذاكِر — Zaker</title>
    <script>
      // إذا فتح المستخدم ملف index.html مباشرة من الفولدر
      if (window.location.protocol === 'file:') {
        window.location.replace('http://localhost:5180');
      }
    </script>
  </head>
  <body>
    <div id="file-protocol-helper" style="display: none; font-family: Cairo, system-ui, sans-serif; text-align: center; padding: 40px 24px; max-width: 480px; margin: 50px auto; border: 2px solid #221c35; border-radius: 20px; box-shadow: 4px 4px 0 #221c35; background: #fff;">
      <span style="font-size: 48px;">📚</span>
      <h2 style="font-size: 24px; font-weight: 900; margin: 15px 0 10px; color: #221c35;">تطبيق ذاكِر (Zaker)</h2>
      <p style="color: #666; font-size: 14px; margin-bottom: 25px; line-height: 1.6;">
        جاري تحويلك إلى التطبيق... إذا لم يفتح تلقائياً، اضغط على الزر أدناه:
      </p>
      <a href="http://localhost:5180" style="display: inline-block; background: #f26430; color: #fff; font-weight: 800; text-decoration: none; padding: 12px 28px; border-radius: 999px; border: 2px solid #221c35; box-shadow: 2px 2px 0 #221c35; font-size: 15px;">
        فتح التطبيق (http://localhost:5180) 🚀
      </a>
    </div>
    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('file-protocol-helper').style.display = 'block';
      }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
