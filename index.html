<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ذاكر - تنظيم اليوم الدراسي وجدول المذاكرة والمهام اليومية</title>
    <meta name="description" content="ذاكر: تطبيق للمذاكرة وتحديد جداول للمهام اليومية والمذاكرة اليومية وتنظيم اليوم الدراسي والواجبات المدرسية - يعمل أوفلاين 100% بدون إنترنت." />
    <meta name="theme-color" content="#f26430" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ذاكر" />
    <meta name="application-name" content="ذاكر" />

    <link rel="icon" type="image/png" href="/Zaker-MB/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/Zaker-MB/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/Zaker-MB/favicon.svg" />
    <link rel="apple-touch-icon" href="/Zaker-MB/apple-touch-icon.png" />
    <link rel="manifest" href="/Zaker-MB/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">

    <script>
      // تسجيل Service Worker لضمان العمل أوفلاين 100% بدون إنترنت
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          var swPath = window.location.pathname.includes('/Zaker-MB') ? '/Zaker-MB/sw.js' : '/sw.js';
          var swScope = window.location.pathname.includes('/Zaker-MB') ? '/Zaker-MB/' : '/';
          navigator.serviceWorker.register(swPath, { scope: swScope }).then(function(reg) {
            console.log('[Zaker SW] Service Worker مسجل بنجاح بنطاق:', reg.scope);
            reg.update().catch(function() {});
            if ('sync' in reg && reg.sync) {
              reg.sync.register('sync-tasks').catch(function() {});
            }
            if ('periodicSync' in reg && reg.periodicSync) {
              reg.periodicSync.register('daily-schedule-sync', { minInterval: 24 * 60 * 60 * 1000 }).catch(function() {});
            }
          }).catch(function(err) {
            console.warn('[Zaker SW] فشل تسجيل Service Worker:', err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
