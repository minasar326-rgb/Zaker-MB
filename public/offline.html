<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ذاكر - وضع عدم الاتصال</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
      background: #faf6ed;
      color: #221c35;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 2px solid #221c35;
      box-shadow: 6px 6px 0 #221c35;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 16px;
      display: inline-block;
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      color: #221c35;
      margin-bottom: 12px;
    }
    p {
      color: #666;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #f26430;
      color: #ffffff;
      font-weight: 800;
      padding: 14px 32px;
      border-radius: 999px;
      text-decoration: none;
      border: 2px solid #221c35;
      box-shadow: 3px 3px 0 #221c35;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #221c35;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📚</div>
    <h1>تطبيق ذاكر — وضع الأوفلاين</h1>
    <p>تطبيق ذاكر مصمم للعمل بدون إنترنت 100%. يمكنك متابعة جدولك الدراسي ومهامك ومؤقت المذاكرة في أي وقت دون الحاجة لشبكة.</p>
    <button class="btn" onclick="location.href='/Zaker-MB/'">فتح جدول المذاكرة 🚀</button>
  </div>
</body>
</html>
